name: Deploy IDE

# The IDE is a static SPA, but it cannot be built from a fresh checkout: the kernel Wasm and
# the runtime CLI assets are gitignored build artifacts (docs/DEV.md §1-2). So the build runs
# here, with a real Rust toolchain and a cache keyed by kernel commit, and the finished
# `ide/dist` is uploaded to Cloudflare Pages (D-077).
# Cloudflare's own Git integration is deliberately not used: it cannot cache the ~2 min
# toolchain + ~100 s cargo build, and its builder is the wrong place to reproduce it.
# Nothing needs to run locally: the workflow creates the Pages project itself (idempotent).
# The ide.facilis.dev custom domain is added once from the project's Custom domains page; the
# deploy job also attempts it, but only a token with zone permissions can do that.
#
# This is the single release workflow (D-164): when a push can have changed packages/ it
# publishes the @facilis.dev packages first, then builds the IDE against that exact version.
# Publishing rides the deploy instead of racing it in a parallel workflow, which could deploy
# an IDE pinned to a version npm does not serve yet (or to an older one).
# The upload authenticates with npm trusted publishing (OIDC), not a stored token: the job
# mints a short-lived GitHub identity token, the npm CLI exchanges it for a publish credential,
# and provenance is attached automatically. There is no NPM_TOKEN secret to leak or rotate.
on:
  push:
    branches: [main]
    paths:
      - "ide/**"
      - "packages/**"
      - "examples/**"
      - "deploy/**"
      - "scripts/dev/**"
      - "vendor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-ide.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a new patch version of the @facilis.dev packages first"
        type: boolean
        default: false

concurrency:
  group: deploy-ide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Where the build scripts keep rustup, cargo, wasm-pack and their scratch trees.
  FACILIS_TOOLING_DIR: /tmp/facilis-dev

jobs:
  deploy:
    name: Build and deploy ide.facilis.dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Trusted publishing: `id-token: write` is the permission that lets the job mint the OIDC
    # token npm exchanges. GitHub-hosted runners only — the exchange refuses self-hosted ones.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The publish decision diffs HEAD^ against HEAD, so the parent must be present.
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publishing must ride the deploy instead of racing it: a parallel workflow could deploy
      # an IDE pinned to a version npm does not serve yet (or an older one). A push publishes
      # when it can have changed packages/; a manual run publishes only when asked to.
      - name: Decide whether to publish the packages
        id: packages
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed="$PUBLISH_INPUT"
          elif ! git diff --quiet HEAD^ HEAD -- packages/; then
            # Non-zero also covers a diff we cannot compute (e.g. shallow history): publishing
            # an extra patch is harmless, deploying an IDE against packages older than the
            # commit is not.
            changed=true
          else
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # The packages are the published contract: never upload them from a red tree. The gate is
      # package-scoped because the IDE is not published, and it runs before the long Wasm build
      # so a package regression fails in minutes, not after the IDE has been built.
      - name: Gate the packages
        if: steps.packages.outputs.changed == 'true'
        run: |
          pnpm exec turbo run lint typecheck build --filter='./packages/*'
          pnpm exec turbo run test --concurrency=2 --filter='./packages/*' -- --fsModuleCachePath=node_modules/.vitest-cache
          node scripts/check-file-length.mjs

      # Trusted publishing has three preconditions, and each of them fails the run in seconds
      # here instead of after the long Wasm build (docs/DEV.md section 13): the npm CLI must be
      # new enough to exchange the OIDC token, the job must be allowed to mint one, and no
      # token may be present — npm prefers a token over OIDC, which would silently fall back.
      - name: Check the trusted-publishing preconditions
        if: steps.packages.outputs.changed == 'true'
        run: |
          set -eu
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) { console.error("::error::Node " + process.version + " is too old for trusted publishing: npm needs >= 22.14"); process.exit(1) }'
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version cannot exchange an OIDC token for a publish credential: trusted publishing needs npm >= 11.5.1"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::this job may not mint an OIDC token: give it 'permissions: id-token: write'"
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is in the environment and npm prefers it over OIDC: remove it from this workflow"
            exit 1
          fi
          echo "node $(node --version), npm $npm_version, OIDC token available: publishing with trusted publishing (provenance is automatic)"

      - name: Publish
        id: publish
        if: steps.packages.outputs.changed == 'true'
        run: node scripts/publish-packages.mjs --skip-build

      # The IDE installs the exact packages version: this run's release when it published,
      # otherwise the latest already on npm. Never a range — the version is pinned at build time.
      - name: Resolve the @facilis.dev packages version
        id: framework-version
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          version="${PUBLISHED_VERSION:-}"
          if [ -z "$version" ]; then
            if ! version=$(npm view @facilis.dev/core version 2>/dev/null); then
              echo "::error::no published @facilis.dev/core version was found on npm: publish the packages first (workflow_dispatch with publish=true, or a push that changes packages/)"
              exit 1
            fi
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the @facilis.dev packages version '$version' is not a plain semver (dist-tag or registry problem)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building the IDE against @facilis.dev packages $version"

      # Account state the operator should never create by hand. Idempotent: the first run
      # creates the project, every later run reads it back. It runs before the long build so
      # a missing/under-scoped token fails in under a minute instead of after the Wasm build.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' -H "$auth" "$api/facilis-ide")
          if [ "$code" = "200" ]; then
            echo "Pages project facilis-ide already exists"
          elif [ "$code" = "404" ]; then
            curl -fsS -X POST "$api" -H "$auth" -H "Content-Type: application/json" \
              -d '{"name":"facilis-ide","production_branch":"main"}'
            echo "Pages project facilis-ide created (production branch: main)"
          else
            cat /tmp/cf-project.json
            exit 1
          fi

      - name: Resolve the pinned kernel commit
        id: kernel
        run: echo "sha=$(git -C vendor/vivari rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A cache hit skips the rustup download and the cargo build entirely (the script
      # would otherwise set the toolchain up before noticing the artifacts are present).
      - name: Cache kernel Wasm
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/vivari/packages/vfs/pkg
            vendor/vivari/packages/codec/pkg
            vendor/vivari/packages/crypto/pkg
          key: kernel-wasm-${{ steps.kernel.outputs.sha }}-${{ hashFiles('scripts/dev/build-kernel-wasm.sh') }}

      - name: Build kernel Wasm
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: pnpm ide:wasm

      - name: Vendor the runtime assets the kernel fetches
        run: pnpm ide:assets

      # The hosted build's deployment config (D-077/D-082): the open profile plus the public
      # GitHub App client id for device-flow sign-in. Public by design, not a secret.
      # FACILIS_PACKAGES_VERSION pins the generated project's framework deps to the version
      # this run published (or verified on npm), so the deployed IDE never installs anything else.
      - name: Build the IDE
        env:
          FACILIS_DEPLOY_CONFIG: ${{ github.workspace }}/deploy/ide.facilis.dev.json
          FACILIS_PACKAGES_VERSION: ${{ steps.framework-version.outputs.version }}
        run: pnpm --filter @facilis.dev/ide build:app

      - name: Deploy to Cloudflare Pages
        working-directory: ide
        run: npx --yes wrangler@4.156.0 pages deploy dist --project-name=facilis-ide --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Attaching the domain is idempotent and best-effort: the deployment above already
      # landed, and a token without the zone permissions must not fail the release. The zone
      # is on Cloudflare, so Pages creates the proxied CNAME and the certificate itself.
      - name: Attach the ide.facilis.dev custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/facilis-ide/domains"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o /tmp/cf-domain.json -w '%{http_code}' -H "$auth" "$api/ide.facilis.dev")
          if [ "$code" = "200" ]; then
            echo "custom domain ide.facilis.dev already attached"
          elif [ "$code" = "404" ]; then
            if curl -fsS -X POST "$api" -H "$auth" -H "Content-Type: application/json" \
                 -d '{"name":"ide.facilis.dev"}' >/dev/null; then
              echo "custom domain ide.facilis.dev attached; its certificate is issued asynchronously"
            else
              echo "::warning::could not attach ide.facilis.dev — attach it from the Pages project's Custom domains page"
            fi
          else
            cat /tmp/cf-domain.json
            echo "::warning::could not read the custom-domain state — attach ide.facilis.dev from the Pages project's Custom domains page"
          fi

      # wrangler exiting 0 only means the upload landed. The headers are what make the
      # kernel boot, so assert them on the production URL (*.pages.dev serves the same
      # deployment as the custom domain, without waiting for DNS or the certificate).
      - name: Verify the production deployment
        run: |
          set -eu
          base="https://facilis-ide.pages.dev"
          headers=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -D - -o /dev/null "$base/")
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -qi '^cross-origin-opener-policy: same-origin'
          printf '%s\n' "$headers" | grep -qi '^cross-origin-embedder-policy: require-corp'
          curl -fsS -D - -o /dev/null "$base/sw.js" | grep -qi '^service-worker-allowed: /'
          for path in manifest.json __vv-preview-boot.html __vv-bridge.html favicon.svg; do
            code=$(curl -fsSL -o /dev/null -w '%{http_code}' "$base/$path")
            test "$code" = "200"
          done
          # The custom domain trails the first deploy while Cloudflare provisions its
          # certificate, so a slow first run is a warning rather than a release failure.
          for attempt in 1 2 3 4 5 6; do
            if custom=$(curl -fsS -m 10 -D - -o /dev/null https://ide.facilis.dev/ 2>/dev/null) &&
               printf '%s\n' "$custom" | grep -qi '^cross-origin-opener-policy: same-origin'; then
              echo "ide.facilis.dev serves the deployment with COOP/COEP"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::ide.facilis.dev is not serving with COOP/COEP yet (first-deploy DNS/certificate); re-run after a few minutes"
