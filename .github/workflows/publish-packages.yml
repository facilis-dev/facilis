name: Publish packages

# Publishing rides the deploy: every push to main that can change the framework packages uploads
# all of them to npm under the @facilis.dev scope with the next patch version, so an IDE
# deployed from a commit never installs packages older than that commit (D-164). The package
# surface is gated here instead of waiting for the CI workflow: the same push triggers both in
# parallel, so there is nothing to wait for. The IDE is not published and stays out of the gate.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/check-file-length.mjs"
      - "scripts/publish-packages.mjs"
      - ".github/workflows/publish-packages.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and stage the packages, print the publish commands, upload nothing"
        type: boolean
        default: false

# Serialised on purpose: two overlapping runs would derive the same next version and the second
# upload would fail with E409, or worse, publish a half-updated set.
concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @facilis.dev/* to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The packages are the published contract: never upload them from a red tree.
      - name: Gate the packages
        run: |
          pnpm exec turbo run lint typecheck build --filter='./packages/*'
          pnpm exec turbo run test --concurrency=2 --filter='./packages/*' -- --fsModuleCachePath=node_modules/.vitest-cache
          node scripts/check-file-length.mjs

      - name: Check the npm credentials
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN repository secret is missing: add a granular npm token with read/write on @facilis.dev (docs/DEV.md section 13)"
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-packages.mjs --skip-build ${{ inputs.dry_run && '--dry-run' || '' }}
