# Facilis reference collector — generic OpenTelemetry Collector (otelcol-contrib).
# D-203 §7 / D-209: a fail-closed redaction allowlist plus IP truncation, defense in
# depth behind the app-side scrub (spec §8.8). Facilis hosts nothing: point the app's
# telemetry endpoint (deploy option exporterEndpoint / FACILIS_TELEMETRY_ENDPOINT) at
# this receiver, and the exporter below at YOUR backend. See docs/TELEMETRY.md.
#
# Check it with: otelcol-contrib validate --config docs/telemetry/otelcol.yaml

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform:
    error_mode: ignore
    trace_statements:
      # Resource identity is value-free too: keep only the framework resource set.
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "deployment.id", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
      - context: span
        statements:
          # IP truncation (D-203 §7): IPv4 keeps the /24 prefix, IPv6 the /48.
          # Facilis forwards server-side and never sends the end-user IP; these rules
          # cover a client.address attribute injected by your own proxy/gateway or
          # arriving from other OTLP sources. In collector YAML, $$ escapes the env
          # substitution so OTTL sees the $1 capture reference.
          - replace_pattern(attributes["client.address"], '^([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}$', '$$1.0/24')
          - replace_pattern(attributes["client.address"], '^([0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):.*$', '$$1::/48')

  # Fail-closed attribute allowlist: everything outside the framework vocabulary is
  # dropped — raw URLs, query strings, headers, bodies and PII-bearing keys included.
  # Keep this list in sync with packages/nitro/src/runtime/telemetry/vocabulary.ts;
  # collector-config.test.ts fails on drift.
  redaction:
    allow_all_keys: false
    allowed_keys:
      - http.request.method
      - http.route
      - http.response.status_code
      - db.system.name
      - db.operation.name
      - db.collection.name
      - facilis.job.name
      - facilis.job.attempt
      - facilis.workflow.name
      - facilis.workflow.step
      - facilis.workflow.step.kind
      - browser.web_vital.name
      - browser.web_vital.value
      - browser.web_vital.rating
      - error.type
      - facilis.rum.source
      # Legacy semconv aliases browser SDKs may still emit on a direct export.
      - http.method
      - http.status_code
      - db.system
      - db.operation
      - db.table
      # The truncated client address (see the transform processor above).
      - client.address
    blocked_key_patterns:
      - ".*token.*"
      - ".*secret.*"
      - ".*password.*"
      - ".*authorization.*"
      - ".*cookie.*"
      - ".*api_key.*"

  batch: {}

exporters:
  otlphttp:
    # YOUR backend (Tempo, Grafana Cloud, Elastic, Honeycomb, ...). The credential
    # stays server-side: inject it from the environment, never into the app/browser.
    endpoint: https://tempo.example.com
    headers:
      authorization: "Bearer ${env:COLLECTOR_BACKEND_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      # Truncate before the allowlist runs, so the kept client.address is the /24 or /48.
      processors: [transform, redaction, batch]
      exporters: [otlphttp]
