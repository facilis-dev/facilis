<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Facilis" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="facilis.dev — the browser IDE for Facilis apps. No install, no server to provision: build, run and inspect a real app from the tab."
    />
    <link rel="canonical" href="https://ide.facilis.dev/" />
    <title>facilis.dev</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash. The attribute
      // values mirror src/ui-themes.ts — a theme there needs its block in index.css.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            isDark ? "facilis-dark" : "facilis-light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "facilis-dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
