packages:
  - "packages/*"
  - "examples/*"
  - "ide"

catalog:
  "@types/node": 22.20.5
  oxlint: 1.89.0
  prettier: 3.9.10
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.0.5

# pnpm 12 refuses a fresh install unless every package with an install script has been
# ruled on (strictDepBuilds -> ERR_PNPM_IGNORED_BUILDS), which broke CI on a clean checkout.
# Both are safe to skip: esbuild's binary comes from its platform optional dependency and
# core-js's postinstall is a donation banner. These were already being skipped locally.
allowBuilds:
  core-js: false
  esbuild: false

minimumReleaseAgeExclude:
  - "@xyflow/react@12.12.1"
  - "@xyflow/system@0.0.84"
  - "@tailwindcss/node@4.3.5"
  - "@tailwindcss/oxide-android-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-x64@4.3.5"
  - "@tailwindcss/oxide-freebsd-x64@4.3.5"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.5"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.5"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.5"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.5"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.5"
  - "@tailwindcss/oxide@4.3.5"
  - "@tailwindcss/vite@4.3.5"
  - tailwindcss@4.3.5

# The browser parser adapter (ide/src/facilis/analyze-worker.ts) loads oxc-parser's
# wasm32-wasip1 binding. That binding declares @emnapi/core/@emnapi/runtime at
# 2.0.0-alpha.6, while @napi-rs/wasm-runtime peer-resolves its own copy (^1.7.1 ||
# 2.0.0-beta.2): two emnapi copies break the wasm bridge in the browser with
# "this.bridge.setLastError is not a function" (docs/archive/ast-introspection.md §4.2).
# pnpm only reads overrides from the workspace root, so the single verified pair is pinned
# here; alpha.6/beta.2/beta.3 all passed the probe, beta.2 is the one the generated project
# already uses (ide/src/facilis/project-files.ts).
overrides:
  "@emnapi/core": 2.0.0-beta.2
  "@emnapi/runtime": 2.0.0-beta.2
